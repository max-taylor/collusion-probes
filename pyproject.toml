[project]
name = "ai-collusion-sprint"
version = "0.1.0"
description = "Linear probes for collusive intent in LLM pricing decisions"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipython>=8",
]

[tool.basedpyright]
typeCheckingMode = "standard"
